apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eks-mega-chart.fullname" . }}
  labels:
    {{- include "eks-mega-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "eks-mega-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}  # Add for secret changes too
      labels:
        {{- include "eks-mega-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "eks-mega-chart.serviceAccountName" . }}  # Reference new helper (add to _helpers.tpl)
      {{- with .Values.podSecurityContext }}  # From values
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}  # From values
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 80 }}  # Align with service
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.startupProbe }}  # Add optional startupProbe
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.configData .Values.secretData }}
          envFrom:
            {{- if .Values.configData }}
            - configMapRef:
                name: {{ include "eks-mega-chart.fullname" . }}-config
            {{- end }}
            {{- if .Values.secretData }}
            - secretRef:
                name: {{ include "eks-mega-chart.fullname" . }}-secret
            {{- end }}
          {{- end }}
          {{- if .Values.volumeMounts }}  # Add for read-only FS
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if .Values.volumes }}  # Corresponding volumes
      volumes:
        - name: tmp
          emptyDir: {}
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}