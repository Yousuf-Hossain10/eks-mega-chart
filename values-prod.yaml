# Production overrides
replicaCount: 3

topologySpreadConstraints:
  whenUnsatisfiable: DoNotSchedule  # Real AZ capacity in prod - enforce the spread, don't just prefer it

# Per docs/adr/0002-resource-limits.md: no CPU limit, memory request == limit.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70  # Add for balanced scaling

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/xxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Add your ACM ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'  # Enforce HTTPS
    alb.ingress.kubernetes.io/ssl-redirect-443: 'true'  # Redirect HTTP to HTTPS
  hosts:
    - host: api.mycompany.com
      paths:
        - path: /
          pathType: Prefix

configData:
  DB_HOSTNAME: "prod-db-rds.amazonaws.com"
  LOG_LEVEL: "warn"
  ENABLE_FEATURE_X: "true"

# secretData is intentionally unset (not {}) in prod. Values files are
# plain YAML, not templated - "{{ .Values.secretData.DB_PASSWORD }}" used
# to sit here as a literal string, which Helm would base64-encode
# verbatim into the Secret. There was never a real secret behind it.
#
# `null` (not {}) is required to actually clear the fake dev placeholders
# inherited from values.yaml on merge - an empty map merges and keeps
# them, null unsets the key entirely. See docs/secrets-management.md for
# the real options for getting prod secrets into this chart; none of them
# are implemented yet, so right now a prod install renders no Secret and
# no custom env vars from secretData at all - an honest gap, not a fake one.
secretData: null