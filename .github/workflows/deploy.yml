name: EKS Helm Deploy

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to latest version for better security/features

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # Updated to latest version
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}  # OIDC role assumption, no static keys
          aws-region: ${{ vars.AWS_REGION }}  # Use repo variable for region (set in GitHub settings)

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}  # Use variables for cluster/region

      - name: Install Helm
        uses: azure/setup-helm@v4  # Updated to latest version

      - name: Lint Helm Chart
        run: helm lint .  # Chart.yaml lives at the repo root, not ./eks-mega-chart

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install my-app-prod . \
            --namespace production \
            --create-namespace \
            -f values-prod.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m0s