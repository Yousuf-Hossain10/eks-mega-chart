name: Deploy (reusable)

# Reusable workflow only - never triggers on its own. A service repo
# calls this explicitly via `uses:`, once per environment it wants to
# deploy to. Nothing in this repository triggers a deploy anymore; see
# NOTES.md for what used to happen here (push to master -> straight to
# a production namespace, no approval gate at all) and why that's closed
# now.
on:
  workflow_call:
    inputs:
      service_name:
        description: "Name of the service being deployed - used as the Helm release name."
        type: string
        required: true
      environment:
        description: "Target environment. Must be exactly one of: dev, staging, prod."
        type: string
        required: true
      image_tag:
        description: "Git SHA to deploy. Rejected by values.schema.json (and re-checked here) if it's 'latest' or empty."
        type: string
        required: true
      namespace:
        description: "Kubernetes namespace to deploy into."
        type: string
        required: true
      chart_ref:
        description: "Git ref of Yousuf-Hossain10/eks-mega-chart to deploy the chart from. Defaults to master; pin a tag/SHA for reproducible deploys."
        type: string
        required: false
        default: master

permissions:
  id-token: write
  contents: read

jobs:
  # Runs with NO `environment:` set, deliberately, and before the job
  # that has one. Job-level `environment:` is resolved before any step
  # in that job runs, so validation can't happen inside the gated job
  # itself - if it could, a typo'd environment name (e.g. "produciton")
  # would make GitHub silently create and use a brand-new, unprotected
  # ad-hoc environment, bypassing the approval gate entirely instead of
  # failing loudly. This job exists specifically to close that gap.
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment and image tag
        run: |
          case "${{ inputs.environment }}" in
            dev|staging|prod) ;;
            *)
              echo "::error::environment must be exactly one of dev, staging, prod - got '${{ inputs.environment }}'"
              exit 1
              ;;
          esac
          if [ -z "${{ inputs.image_tag }}" ] || [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "::error::image_tag must be a real git SHA, not empty or 'latest' - got '${{ inputs.image_tag }}'"
            exit 1
          fi

  # Real, in-workflow enforcement that a failed scan blocks a deploy -
  # deliberately NOT relying on branch protection on eks-mega-chart's
  # own master. That would only prove the chart TEMPLATE is clean; it
  # says nothing about the service's own application image (the thing
  # actually being deployed via inputs.image_tag), and a caller can
  # override chart_ref to any ref anyway. This job scans the real image
  # this specific run is about to ship, and deploy needs: it, the same
  # way it needs: validate-inputs - no separate repo setting to configure
  # or forget, no coupling to rely on that could quietly stop applying.
  scan-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling service repo (its own values file)
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          TRIVY_VERSION=v0.72.0
          curl -sSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          chmod +x /tmp/trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy

      # Pulled from the caller's own values-<environment>.yaml, not
      # passed as a separate input - there's exactly one place a
      # service's image repository is already declared, and asking
      # callers to repeat it as a second input would let the two drift.
      # Known limitation: assumes the conventional `image:\n  repository:
      # <value>` shape every values file on this platform uses so far -
      # not a full YAML parser. If a values file ever legitimately
      # deviates from that shape, this step needs to grow with it.
      - name: Determine the image being deployed
        id: image
        run: |
          VALUES_FILE="values-${{ inputs.environment }}.yaml"
          IMAGE_REPO=$(grep -A5 "^image:" "$VALUES_FILE" | grep "repository:" | head -1 | sed -E 's/.*repository:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          if [ -z "$IMAGE_REPO" ]; then
            echo "::error::Could not find image.repository in ${VALUES_FILE} - cannot scan without knowing what image is being deployed."
            exit 1
          fi
          echo "image=${IMAGE_REPO}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # --ignore-unfixed: never block on a CVE with no vendor patch
      # anywhere - see eks-mega-chart's .trivyignore header for the full
      # policy argument. A .trivyignore in the CALLING (service) repo's
      # own root is used if present, for that service's own reviewed,
      # dated exceptions - eks-mega-chart's own .trivyignore is scoped to
      # its demo image and is never applied here, that would be someone
      # else's exceptions applied to this service's real image.
      - name: Scan the image being deployed
        run: |
          IGNOREFILE_ARGS=""
          if [ -f .trivyignore ]; then
            IGNOREFILE_ARGS="--ignorefile .trivyignore"
          fi
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            $IGNOREFILE_ARGS \
            "${{ steps.image.outputs.image }}"

  deploy:
    needs: [validate-inputs, scan-image]
    runs-on: ubuntu-latest
    # This is the approval gate. dev and staging are separate GitHub
    # Environments too (so each gets its own scoped AWS role/region/
    # cluster vars, least-privilege per environment) but carry no
    # required reviewers - only prod does. That protection rule lives in
    # the CALLING repo's own Settings -> Environments -> prod, not in
    # this YAML; this workflow can't create it, only respect it.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout calling service repo (its own values file)
        uses: actions/checkout@v4

      - name: Checkout golden-path chart
        uses: actions/checkout@v4
        with:
          repository: Yousuf-Hossain10/eks-mega-chart
          ref: ${{ inputs.chart_ref }}
          path: golden-path-chart

      # OIDC role assumption only - no static AWS_ACCESS_KEY_ID/
      # AWS_SECRET_ACCESS_KEY anywhere. role-to-assume and aws-region
      # come from vars, not secrets, because an IAM role ARN isn't
      # sensitive on its own - the security boundary is the role's trust
      # policy (see the OIDC explanation below), not keeping the ARN
      # string hidden. vars.* resolve against whichever GitHub
      # Environment this job is running under (dev/staging/prod), so
      # each environment can point at its own role and region.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint chart against this service's values file
        run: helm lint golden-path-chart -f "values-${{ inputs.environment }}.yaml" --set image.tag="${{ inputs.image_tag }}"

      # --atomic implies --wait on its own; --wait is listed explicitly
      # anyway so the intent is readable without needing to know that.
      - name: helm upgrade --install
        run: |
          helm upgrade --install "${{ inputs.service_name }}" golden-path-chart \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            -f "values-${{ inputs.environment }}.yaml" \
            --set image.tag="${{ inputs.image_tag }}" \
            --atomic \
            --wait \
            --timeout 5m0s

      - name: Deployment summary
        run: |
          REVISION=$(helm status "${{ inputs.service_name }}" -n "${{ inputs.namespace }}" -o json | jq -r '.version')
          echo "Deployed ${{ inputs.service_name }} to ${{ inputs.environment }} (namespace: ${{ inputs.namespace }})"
          echo "Image tag:    ${{ inputs.image_tag }}"
          echo "Helm revision: ${REVISION}"
          {
            echo "## Deploy summary"
            echo "| | |"
            echo "|---|---|"
            echo "| Service | ${{ inputs.service_name }} |"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Namespace | ${{ inputs.namespace }} |"
            echo "| Image tag | \`${{ inputs.image_tag }}\` |"
            echo "| Helm revision | ${REVISION} |"
          } >> "$GITHUB_STEP_SUMMARY"
