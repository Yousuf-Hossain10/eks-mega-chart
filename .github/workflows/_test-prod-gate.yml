# TEMPORARY. Exists only to manually trigger a prod-targeted run of
# deploy.yml from within this same repo, so the "prod" GitHub
# Environment's approval gate can be watched happening live, with no
# AWS account required - see NOTES.md for why the gate is expected to
# pause before any AWS step runs. Delete this file once you've verified
# the gate works; it isn't part of the platform's real product surface.
name: TEST prod approval gate (delete after verifying)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod-test:
    uses: ./.github/workflows/deploy.yml
    with:
      service_name: gate-test
      environment: prod
      image_tag: "0000000"
      namespace: gate-test
