name: CI

# Validation only. This workflow never touches AWS or a cluster - no
# OIDC role assumption, no kubeconfig, no credentials of any kind. It
# proves the chart renders correctly; deploy.yml is the only workflow
# that ships anything anywhere, and it's a separate file on purpose.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  # Pinned deliberately. helm/helm's "latest" tag is now a v4 release,
  # and Helm v4 plugin manifests use a schema (platformHooks) that a v3
  # Helm binary can't even parse - discovered while verifying this
  # workflow locally, not assumed. Pinning avoids CI silently moving to
  # an untested major version.
  HELM_VERSION: v3.17.3
  KUBECONFORM_VERSION: v0.8.0
  # Newest helm-unittest release still compatible with Helm v3's plugin
  # loader - v1.1.x's plugin.yaml uses the v4-only platformHooks field
  # and fails to install under v3. Verified locally before pinning.
  HELM_UNITTEST_VERSION: v1.0.3
  KIND_VERSION: v0.32.0
  # Real, pinned, third-party tag - see tests/values-smoke.yaml for why
  # nginx and why this specific tag, not "latest".
  SMOKE_IMAGE_TAG: "1.25.4"

jobs:
  validate:
    name: validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One leg per environment values file. See the explanation at the
      # bottom of this file (and the PR/commit message) for why this is
      # a matrix and not "test dev, assume staging and prod follow."
      matrix:
        include:
          - environment: dev
            values_file: ""
          - environment: staging
            values_file: values-staging.yaml
          - environment: prod
            values_file: values-prod.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # Downloaded and extracted entirely under /tmp - never the checkout
      # directory. Helm loads every file in the chart root when linting/
      # templating, and hard-rejects anything over 5MB as chart content;
      # this used to download kubeconform.tar.gz straight into the repo
      # root and never deleted it, which broke every helm lint/template
      # call in this job with "chart file kubeconform.tar.gz is larger
      # than the maximum file size 5242880." A .helmignore now exists too
      # as a second line of defense, but not needing it in the first
      # place is the real fix.
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          chmod +x /tmp/kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint
        run: |
          if [ -n "${{ matrix.values_file }}" ]; then
            helm lint . -f "${{ matrix.values_file }}" --set image.tag="${GITHUB_SHA}"
          else
            helm lint . --set image.tag="${GITHUB_SHA}"
          fi

      - name: helm template
        run: |
          if [ -n "${{ matrix.values_file }}" ]; then
            helm template ci . -f "${{ matrix.values_file }}" --set image.tag="${GITHUB_SHA}" > "rendered-${{ matrix.environment }}.yaml"
          else
            helm template ci . --set image.tag="${GITHUB_SHA}" > "rendered-${{ matrix.environment }}.yaml"
          fi

      - name: kubeconform (strict)
        run: kubeconform -strict -summary "rendered-${{ matrix.environment }}.yaml"

  schema-negative-tests:
    name: values.schema.json rejects known-bad input
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # These two files exist specifically to be rejected. If either one
      # renders successfully, the validation this whole workflow exists
      # to enforce has silently broken - so a passing render here is the
      # failure, not the success.
      - name: tests/invalid-demo.yaml must be rejected by values.schema.json
        run: |
          if helm template ci . -f tests/invalid-demo.yaml --set image.tag="${GITHUB_SHA}" > /dev/null 2>&1; then
            echo "::error::tests/invalid-demo.yaml rendered successfully - values.schema.json failed to reject it."
            exit 1
          fi
          echo "Correctly rejected by the schema."

      - name: tests/invalid-replicas-demo.yaml must be rejected by the hpa.yaml fail guard
        run: |
          if helm template ci . -f tests/invalid-replicas-demo.yaml --set image.tag="${GITHUB_SHA}" > /dev/null 2>&1; then
            echo "::error::tests/invalid-replicas-demo.yaml rendered successfully - the autoscaling.maxReplicas >= minReplicas guard in templates/hpa.yaml failed to catch it."
            exit 1
          fi
          echo "Correctly rejected by the template guard."

  unittest:
    name: helm unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"

      # tests/*_test.yaml are real unittest specs now (deployment, hpa,
      # ingress, pdb). tests/invalid-*-demo.yaml live in the same
      # directory but aren't test suites - helm-unittest's default glob
      # is tests/*_test.yaml, so it never touches them; see NOTES.md.
      - name: Run helm unittest
        run: helm unittest .

  kind-smoke-test:
    name: kind smoke test
    runs-on: ubuntu-latest
    # Still no AWS, no OIDC, no cluster credentials - kind is a local,
    # ephemeral, disposable cluster running entirely inside this job's
    # own runner via Docker. Nothing here talks to a real account.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster --name golden-path --wait 120s

      # tests/values-smoke.yaml swaps in nginx (a real, pullable image)
      # for the chart's placeholder image, and points the probes at the
      # one path nginx actually serves. See that file for why - this is
      # the "test-only values override" approach, not a smoke image
      # chosen to answer every possible path regardless of correctness.
      - name: helm install (dev values + smoke overlay)
        run: |
          helm install smoke . \
            -f tests/values-smoke.yaml \
            --set image.tag="${SMOKE_IMAGE_TAG}" \
            --set fullnameOverride=smoke-test \
            --namespace smoke-test \
            --create-namespace \
            --wait \
            --timeout 3m

      # helm install --wait already blocks until the Deployment is
      # available, but that's implicit - this makes "pods actually
      # reached Ready" an explicit, readable assertion in its own step,
      # not just a side effect of a flag three steps up.
      - name: Assert pods reached Ready
        run: |
          kubectl -n smoke-test rollout status deployment/smoke-test --timeout=120s
          kubectl -n smoke-test wait pod \
            -l app.kubernetes.io/instance=smoke,app.kubernetes.io/name=eks-mega-chart \
            --for=condition=Ready \
            --timeout=120s

      # The Day-1-adjacent failure mode this catches: a Service whose
      # selector doesn't actually match any pod's labels. helm template +
      # kubeconform both think that Service is perfectly valid YAML -
      # neither one knows or cares whether the Deployment's pod template
      # labels and the Service's selector happen to agree. Only a real
      # cluster, asked "does this Service actually have any endpoints,"
      # can tell the difference between "valid" and "actually works."
      # Polls rather than checking once: a Service can exist for a moment
      # before the endpoint controller has observed the (already-Ready)
      # pod and populated Endpoints/EndpointSlice. A single check here
      # would be a race, not a real assertion. 30 attempts * 2s = 60s
      # budget - generous enough to rule out propagation lag, but a
      # genuine selector mismatch still fails (just after burning the
      # full budget first, since it can never resolve).
      - name: Assert the Service has real endpoints
        run: |
          for i in $(seq 1 30); do
            ENDPOINTS=$(kubectl -n smoke-test get endpoints smoke-test -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            if [ -n "$ENDPOINTS" ]; then
              echo "Service smoke-test has real endpoints: ${ENDPOINTS}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Service smoke-test has no endpoints after 60s - its selector matches no Ready pod. helm template and kubeconform both passed this; only a real cluster catches it."
          kubectl -n smoke-test get endpoints smoke-test -o yaml
          kubectl -n smoke-test get pods -o wide
          exit 1

      # Runs only on failure, before cleanup tears the cluster down. The
      # first real run of this job failed at "helm install" with a bare
      # "context deadline exceeded" - true, but useless on its own: it
      # doesn't say whether the pod never scheduled, crash-looped, failed
      # its probes, or couldn't pull the image. This step exists so the
      # next failure, whatever it is, is diagnosable from the log alone
      # instead of needing another round-trip to guess and re-run.
      - name: Dump cluster state (on failure)
        if: failure()
        run: |
          echo "--- pods ---"
          kubectl -n smoke-test get pods -o wide || true
          echo "--- pod describe ---"
          kubectl -n smoke-test describe pods || true
          echo "--- current container logs ---"
          kubectl -n smoke-test logs -l app.kubernetes.io/instance=smoke --all-containers --tail=200 || true
          echo "--- previous container logs (if it crash-looped) ---"
          kubectl -n smoke-test logs -l app.kubernetes.io/instance=smoke --all-containers --previous --tail=200 || true
          echo "--- events, most recent last ---"
          kubectl -n smoke-test get events --sort-by=.lastTimestamp || true

      - name: helm uninstall
        if: always()
        run: helm uninstall smoke -n smoke-test --wait --timeout 2m || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name golden-path || true
