# DELIBERATELY INSECURE. Not generated by this chart - values.schema.json
# pins runAsNonRoot/readOnlyRootFilesystem/allowPrivilegeEscalation with
# const specifically so no values override can ever produce a manifest
# this bad (see docs/opinions.md). This fixture proves the SCANNER
# itself catches real misconfigurations, the same way
# tests/invalid-demo.yaml proves the schema does and
# tests/invalid-replicas-demo.yaml proves the hpa.yaml fail guard does.
# Do not use this file for anything except the trivy-config-scan CI job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deliberately-insecure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deliberately-insecure
  template:
    metadata:
      labels:
        app: deliberately-insecure
    spec:
      hostNetwork: true
      containers:
        - name: bad
          image: nginx:1.25.4
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add: ["ALL"]
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
