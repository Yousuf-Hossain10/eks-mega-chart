# Smoke-test-only overlay, used exclusively by the kind-smoke-test job in
# ci.yml. values.yaml's image (yourorg/myapp) is a placeholder with
# nothing real to pull, so this substitutes a small, real public image -
# nginx - so the smoke test can prove the chart's actual Kubernetes
# wiring (Deployment -> Pod -> Service, probes gating rollout, the
# Service's selector actually matching real pods) against a container
# that genuinely runs, not just against YAML that happens to parse.
#
# nginx does not serve /healthz or /ready - those are this chart's own
# app-specific defaults, written for a real app that doesn't exist yet.
# Pointing every probe at nginx's real welcome page (served at / on port
# 80, both real defaults nginx actually listens on) is the honest choice
# here: it proves the probes genuinely gate the rollout against a path
# the container actually answers. Silently choosing an image that
# answers every path regardless of what's asked (e.g. hashicorp/http-echo)
# would make this job pass without ever exercising a probe path that
# could plausibly be wrong - closer to papering over the mismatch than
# fixing it.
image:
  repository: nginx
  tag: "1.25.4"

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 10
