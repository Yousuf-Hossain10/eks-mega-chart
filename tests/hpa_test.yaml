suite: hpa.yaml renders only when autoscaling is enabled
release:
  name: test
tests:
  - it: no HPA when autoscaling is disabled (the chart's own default)
    set:
      image.tag: a1b2c3d
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a real HorizontalPodAutoscaler when autoscaling is enabled
    set:
      image.tag: a1b2c3d
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 6
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 6
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
